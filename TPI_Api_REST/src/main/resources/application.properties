spring.application.name=Tp1
# Configuracion de H2 Database
#spring.datasource.url=jdbc:h2:mem:testdb

#Persistencia en archivo
spring.datasource.url=jdbc:h2:file:./data/TPI-API-RESTdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=



# Configuracion JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
#Persistencia en archivo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Por defecto el puerto del server es 8080, pero se puede especificar
# server.port=8080